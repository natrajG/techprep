name: Windows Store package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Bump desktop app patch version
        shell: bash
        working-directory: desktop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          git commit -am "chore: bump desktop version to $(node -p "require('./package.json').version")"
          git push
      - run: npm --prefix frontend/react-web ci
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop test
      - run: npm --prefix desktop run store:win
        env:
          TECHPREP_SERVER_URL: https://interviewassistant.in/
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: techprep-store-appx
          path: desktop/release/store/*.appx
          if-no-files-found: error
          retention-days: 7

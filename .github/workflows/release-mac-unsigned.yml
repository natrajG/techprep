name: macOS unsigned (free-tier) release

# Manual release for when an Apple Developer Program account ($99/yr) is not yet available.
# Runs on a GitHub-hosted macOS runner, so no local Mac is needed, and requires no Apple
# credentials at all. The published .dmg is NOT code-signed or notarized: macOS Gatekeeper
# will warn first-time users, who must right-click -> Open once to bypass it (see
# docs/desktop-capture-protection.md). Switch to release-mac.yml once signing is affordable.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm --prefix frontend/react-web ci
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop test
      - run: npm --prefix desktop run release:mac:unsigned
        env:
          TECHPREP_SERVER_URL: ${{ vars.TECHPREP_SERVER_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: techprep-mac-unsigned-release
          path: |
            desktop/release/production-mac/publish/TechPrep.dmg
            desktop/release/production-mac/publish/desktop-release-mac.json
          if-no-files-found: error
